name: Deploy .NET to test (MonsterASP)

# build/publish (ubuntu) -> [optional migrate/seed] -> Web Deploy to MonsterASP (windows) -> smoke test.
# Manual only (workflow_dispatch). A push trigger can be added once the pipeline has proven itself (see docs/deploy/monsterasp.md).
# Secrets and variables live in the GitHub Environment `test` (branch-restricted); see docs/deploy/monsterasp.md.
# The secret-bearing web.config exists only inside the deploy job's workspace; the published artifact never contains secrets.
# Reference: docs/architecture/dotnet.md section 15.1, ADR-0007.
on:
  # The push trigger exists only so GitHub registers this workflow while it lives on a non-default branch
  # (a dispatch-only workflow off the default branch cannot be dispatched). Push runs skip every job.
  push:
    paths:
      - .github/workflows/deploy-dotnet-test.yml
  workflow_dispatch:
    inputs:
      self_contained:
        description: Fallback - publish self-contained win-x64 (use only if the host has no .NET 10 hosting bundle)
        type: boolean
        default: false
      require_green_ci:
        description: Refuse to deploy unless ".NET CI" succeeded for this commit
        type: boolean
        default: true
      run_migrations:
        description: Run the migrator (migrate) against the test database before deploying (needs the DB to accept GitHub runner IPs)
        type: boolean
        default: false
      seed_test:
        description: Also seed test users (seed-test; with run_migrations only)
        type: boolean
        default: false
      seed_demo:
        description: Also seed demo data (seed-demo --yes-demo; fictitious accounts, deals and activities; TEST data only; idempotent; with run_migrations and migrator=dotnet only; the database must have been through seed-test, which writes the test marker)
        type: boolean
        default: false
      reset_demo:
        description: Remove the demo rows (only those) and reseed them with fresh dates (seed-demo --yes-demo --reset-demo; implies seed_demo)
        type: boolean
        default: false
      migrator:
        description: Migrator to use. "dotnet" = the app's built-in command, "node" = the old Node runner (until the .NET migrator exists)
        type: choice
        options: [dotnet, node]
        default: dotnet
      debug_stdout:
        description: DEBUG ONLY - enable ASP.NET Core stdout log and detailed IIS errors in the deployed web.config
        type: boolean
        default: false
      diagnose:
        description: DIAGNOSE ONLY - after the normal deploy, push web.config variants one by one and probe /healthz (finds the element IIS rejects)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  WEB_PROJECT: dotnet/src/Crm.Web

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Require green .NET CI for this commit
        if: ${{ inputs.require_green_ci }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dotnet-ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')
          if [ "$n" -lt 1 ]; then
            echo "::error::No successful '.NET CI' run for commit $GITHUB_SHA. Wait for CI to pass (or untick require_green_ci for a docs-only commit)."
            exit 1
          fi
          echo "CI green for $GITHUB_SHA"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        env:
          SELF_CONTAINED: ${{ inputs.self_contained }}
        run: |
          test -f "$WEB_PROJECT/Crm.Web.csproj" || { echo "::error::$WEB_PROJECT/Crm.Web.csproj not found (the .NET app does not exist on this commit yet)"; exit 1; }
          if [ "$SELF_CONTAINED" = "true" ]; then
            echo "Publishing self-contained win-x64 (fallback)"
            dotnet publish "$WEB_PROJECT" -c Release -r win-x64 --self-contained true -p:DebugType=none -p:DebugSymbols=false -o out/web
          else
            echo "Publishing framework-dependent net10.0"
            dotnet publish "$WEB_PROJECT" -c Release -p:DebugType=none -p:DebugSymbols=false -o out/web
          fi

      - name: Preflight - published files (names only)
        run: |
          missing=0
          for f in web.config Crm.Web.dll; do
            if [ -e "out/web/$f" ]; then echo "$f present"; else echo "$f MISSING"; missing=1; fi
          done
          grep -q '<aspNetCore' out/web/web.config || { echo "::error::web.config has no <aspNetCore> element"; missing=1; }
          # Defence in depth: nothing secret-looking may ship (secrets are only added later, in the deploy job).
          if find out/web \( -name '.env*' -o -name 'crm.env' -o -name '*.pdb' -o -name 'appsettings.Development.json' \) | grep -q .; then
            echo "::error::unexpected files in publish output:"; find out/web \( -name '.env*' -o -name 'crm.env' -o -name '*.pdb' -o -name 'appsettings.Development.json' \); missing=1
          fi
          if grep -Eqi 'environmentVariable[^>]*(PASSWORD|SECRET|CONNECTION_STRING|ACCESS_CODE)' out/web/web.config; then
            echo "::error::template web.config already contains secret-like environment variables"; missing=1
          fi
          exit $missing

      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: out/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  migrate:
    if: ${{ inputs.run_migrations }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    env:
      DB_AUTH_MODE: sql-password
      DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
      DB_TRUST_SERVER_CERT: ${{ vars.DB_TRUST_SERVER_CERT || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse demo data with the Node migrator
        if: ${{ inputs.migrator == 'node' && (inputs.seed_demo || inputs.reset_demo) }}
        run: |
          echo "::error::seed_demo / reset_demo need migrator=dotnet (the Node runner has no seed-demo command)"
          exit 1

      # GitHub runner IPs are dynamic: if the host's DB firewall rejects them this fails; run from your own PC instead.
      - name: Migrate and seed with the .NET migrator
        if: ${{ inputs.migrator == 'dotnet' }}
        env:
          TEST_ADMIN_NAME: ${{ vars.TEST_ADMIN_NAME }}
          TEST_ADMIN_EMAIL: ${{ vars.TEST_ADMIN_EMAIL }}
          SEED_TEST: ${{ inputs.seed_test }}
          SEED_DEMO: ${{ inputs.seed_demo }}
          RESET_DEMO: ${{ inputs.reset_demo }}
          # seed-demo checks the target, not only the host: it refuses unless all of these say "test deployment" (and the database carries
          # the marker that seed-test wrote). They are set only when demo data was asked for.
          ALLOW_DEMO_SEED: ${{ (inputs.seed_demo || inputs.reset_demo) && 'true' || '' }}
          AUTH_MODE: ${{ (inputs.seed_demo || inputs.reset_demo) && 'test-access-code' || '' }}
        run: |
          dotnet --version
          dotnet run --project "$WEB_PROJECT" -c Release -- migrate
          if [ "$SEED_TEST" = "true" ]; then dotnet run --project "$WEB_PROJECT" -c Release --no-build -- seed-test; fi
          # Demo data runs after seed-test (which writes the test marker). The command itself refuses LIVE=true, Azure and any target
          # that is not sql-password + test-access-code + ALLOW_DEMO_SEED=true + the marker, and needs --yes-demo.
          if [ "$SEED_DEMO" = "true" ] || [ "$RESET_DEMO" = "true" ]; then
            demo_args=(seed-demo --yes-demo --demo-settings)
            if [ "$RESET_DEMO" = "true" ]; then demo_args+=(--reset-demo); fi
            dotnet run --project "$WEB_PROJECT" -c Release --no-build -- "${demo_args[@]}"
          fi

      - uses: actions/setup-node@v4
        if: ${{ inputs.migrator == 'node' }}
        with:
          node-version: 22
          cache: npm

      - name: Migrate and seed with the Node runner
        if: ${{ inputs.migrator == 'node' }}
        env:
          TEST_ADMIN_NAME: ${{ vars.TEST_ADMIN_NAME }}
          TEST_ADMIN_EMAIL: ${{ vars.TEST_ADMIN_EMAIL }}
          SEED_TEST: ${{ inputs.seed_test }}
        run: |
          npm ci --ignore-scripts
          npm run db:migrate
          if [ "$SEED_TEST" = "true" ]; then npm run db:seed:test; fi

  deploy:
    # Migrate may be skipped, but if it ran it must have succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    needs: [build, migrate]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: test
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publish
          path: package

      - name: Validate secrets (format only, values never printed)
        env:
          MONSTERASP_WEBDEPLOY_SERVER: ${{ secrets.MONSTERASP_WEBDEPLOY_SERVER }}
          MONSTERASP_WEBDEPLOY_SITE: ${{ secrets.MONSTERASP_WEBDEPLOY_SITE }}
          MONSTERASP_WEBDEPLOY_USER: ${{ secrets.MONSTERASP_WEBDEPLOY_USER }}
          MONSTERASP_WEBDEPLOY_PASSWORD: ${{ secrets.MONSTERASP_WEBDEPLOY_PASSWORD }}
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          TEST_ACCESS_CODE: ${{ secrets.TEST_ACCESS_CODE }}
          TEST_ADMIN_NAME: ${{ vars.TEST_ADMIN_NAME }}
          TEST_ADMIN_EMAIL: ${{ vars.TEST_ADMIN_EMAIL }}
        run: |
          # SESSION_SECRET is retired (ADR-0007): not read, not required, not written.
          $bad = @()
          foreach ($n in 'MONSTERASP_WEBDEPLOY_SERVER','MONSTERASP_WEBDEPLOY_SITE','MONSTERASP_WEBDEPLOY_USER','MONSTERASP_WEBDEPLOY_PASSWORD','DB_CONNECTION_STRING','TEST_ACCESS_CODE') {
            $v = [Environment]::GetEnvironmentVariable($n)
            if ([string]::IsNullOrEmpty($v)) { $bad += "${n}: not set"; continue }
            # A comma can break the msdeploy argument list (connection strings never go through msdeploy, so they may contain commas).
            if ($n -like 'MONSTERASP_*' -and $v -match ',') { $bad += "${n}: contains a comma" }
            if ($v -match '[\r\n]') { $bad += "${n}: contains a line break" }
            if ($v -ne $v.Trim()) { $bad += "${n}: has leading or trailing whitespace" }
          }
          # Same rule as the app's config loader (dotnet.md section 5), so a bad code fails here and not as HTTP 500.30.
          $code = $env:TEST_ACCESS_CODE
          if ($code -and ($code.Length -lt 24 -or ($code.ToCharArray() | Select-Object -Unique).Count -lt 10)) { $bad += 'TEST_ACCESS_CODE: needs at least 24 characters and at least 10 distinct characters' }
          if ([bool]$env:TEST_ADMIN_NAME -ne [bool]$env:TEST_ADMIN_EMAIL) { $bad += 'TEST_ADMIN_NAME and TEST_ADMIN_EMAIL: set both or neither' }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "::error::$_" }
            throw 'Secret validation failed (see errors above; values are not shown). Fix in Settings > Environments > test.'
          }
          Write-Host 'Secret format OK'

      - name: Write secrets into web.config (XML library, values not shown)
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          TEST_ACCESS_CODE: ${{ secrets.TEST_ACCESS_CODE }}
          TEST_ADMIN_NAME: ${{ vars.TEST_ADMIN_NAME }}
          TEST_ADMIN_EMAIL: ${{ vars.TEST_ADMIN_EMAIL }}
          SITE_URL: ${{ vars.SITE_URL || 'https://crmtest.runasp.net' }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY || '0' }}
          DB_TRUST_SERVER_CERT: ${{ vars.DB_TRUST_SERVER_CERT || 'false' }}
          DATA_PROTECTION_KEYS_PATH: ${{ vars.DATA_PROTECTION_KEYS_PATH }}
          DEBUG_STDOUT: ${{ inputs.debug_stdout }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vars = [ordered]@{
            ASPNETCORE_ENVIRONMENT = 'Production'
            AUTH_MODE              = 'test-access-code'
            REDIRECT_URI           = "$($env:SITE_URL.TrimEnd('/'))/auth/redirect"
            TRUST_PROXY            = $env:TRUST_PROXY
            LOG_LEVEL              = 'info'
            DB_AUTH_MODE           = 'sql-password'
            DB_CONNECTION_STRING   = $env:DB_CONNECTION_STRING
            DB_TRUST_SERVER_CERT   = $env:DB_TRUST_SERVER_CERT
            TEST_ACCESS_CODE       = $env:TEST_ACCESS_CODE
          }
          # Optional named test Admin (plain variables, not secrets).
          if ($env:TEST_ADMIN_NAME -and $env:TEST_ADMIN_EMAIL) {
            $vars['TEST_ADMIN_NAME'] = $env:TEST_ADMIN_NAME
            $vars['TEST_ADMIN_EMAIL'] = $env:TEST_ADMIN_EMAIL
          }
          if ($env:DATA_PROTECTION_KEYS_PATH) { $vars['DATA_PROTECTION_KEYS_PATH'] = $env:DATA_PROTECTION_KEYS_PATH }
          # LIVE and ENTRA_CLIENT_SECRET are deliberately never set on this host.
          foreach ($k in $vars.Keys) { if ([string]::IsNullOrEmpty($vars[$k])) { throw "Value for $k is empty" } }

          $path = Join-Path (Resolve-Path package) 'web.config'
          $doc = New-Object System.Xml.XmlDocument
          $doc.PreserveWhitespace = $false
          $doc.Load($path)
          $asp = $doc.SelectSingleNode('//system.webServer/aspNetCore')
          if (-not $asp) { throw 'web.config has no system.webServer/aspNetCore element' }
          foreach ($old in @($asp.SelectNodes('environmentVariables'))) { [void]$asp.RemoveChild($old) }
          $ev = $doc.CreateElement('environmentVariables')
          foreach ($k in $vars.Keys) {
            $e = $doc.CreateElement('environmentVariable')
            # SetAttribute escapes &, <, " etc.
            $e.SetAttribute('name', $k)
            $e.SetAttribute('value', [string]$vars[$k])
            [void]$ev.AppendChild($e)
          }
          [void]$asp.AppendChild($ev)

          if ($env:DEBUG_STDOUT -eq 'true') {
            $asp.SetAttribute('stdoutLogEnabled', 'true')
            $asp.SetAttribute('stdoutLogFile', '.\logs\stdout')
            $hs = $doc.SelectSingleNode('//system.webServer/httpErrors')
            if ($hs) { $hs.SetAttribute('errorMode', 'Detailed') }
            Write-Host 'DEBUG: stdoutLogEnabled=true, httpErrors Detailed. Redeploy without debug_stdout to revert.'
          }

          $ws = New-Object System.Xml.XmlWriterSettings
          $ws.Indent = $true
          $ws.Encoding = New-Object System.Text.UTF8Encoding($false)
          $w = [System.Xml.XmlWriter]::Create($path, $ws)
          try { $doc.Save($w) } finally { $w.Dispose() }

          # Verify by re-reading: the round trip must give back exactly the values (compared in memory, nothing printed).
          $chk = New-Object System.Xml.XmlDocument
          $chk.Load($path)
          foreach ($k in $vars.Keys) {
            $n = $chk.SelectSingleNode("//aspNetCore/environmentVariables/environmentVariable[@name='$k']")
            if (-not $n -or $n.GetAttribute('value') -ne [string]$vars[$k]) { throw "web.config round-trip check failed for $k" }
          }
          Write-Host ("web.config written; environment variables set: " + ($vars.Keys -join ', ') + ' (values not shown)')

      - name: Preflight - package contents (names only)
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          foreach ($f in 'web.config','Crm.Web.dll') {
            $present = Test-Path (Join-Path package $f)
            Write-Host ("{0,-14} {1}" -f $f, $(if ($present) { 'present' } else { 'MISSING' }))
            if (-not $present) { $missing += $f }
          }
          if ($missing.Count -gt 0) { throw "Package is incomplete, missing: $($missing -join ', ')" }

      - name: Locate or install Web Deploy
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            choco install webdeploy --version 3.6.0 -y --no-progress | Out-Host
            $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $exe) { throw 'msdeploy.exe not found after install' }
          "MSDEPLOY=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "msdeploy: $exe"

      - name: Web Deploy to MonsterASP
        env:
          WD_SERVER: ${{ secrets.MONSTERASP_WEBDEPLOY_SERVER }}
          WD_SITE: ${{ secrets.MONSTERASP_WEBDEPLOY_SITE }}
          WD_USER: ${{ secrets.MONSTERASP_WEBDEPLOY_USER }}
          WD_PASSWORD: ${{ secrets.MONSTERASP_WEBDEPLOY_PASSWORD }}
          WD_ALLOW_UNTRUSTED: ${{ vars.MONSTERASP_WEBDEPLOY_ALLOW_UNTRUSTED || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($n in 'WD_SERVER','WD_SITE','WD_USER','WD_PASSWORD') {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($n))) { throw "Web Deploy secret for $n is not set in Environment 'test'" }
          }
          Write-Host "::add-mask::$env:WD_PASSWORD"
          # Accept either "siteXXXX.siteasp.net" or "siteXXXX.siteasp.net:8172"
          $server = ($env:WD_SERVER -replace '^https?://','' -replace '/.*$','')
          if ($server -notmatch ':\d+$') { $server = "${server}:8172" }
          $src = (Resolve-Path package).Path
          $dest = "contentPath=$($env:WD_SITE),computerName=https://$server/msdeploy.axd?site=$($env:WD_SITE),userName=$($env:WD_USER),password=$($env:WD_PASSWORD),authType=Basic"
          $msArgs = @(
            '-verb:sync',
            "-source:contentPath=$src",
            "-dest:$dest",
            # The in-process app locks its DLLs: app_offline.htm stops it for the duration of the sync.
            '-enableRule:AppOffline',
            # Keep Data Protection keys (App_Data) so a deploy does not sign everybody out, and the ANCM log folder.
            '-skip:objectName=dirPath,absolutePath=.*\\App_Data$',
            '-skip:objectName=filePath,absolutePath=.*\\App_Data\\.*',
            '-skip:objectName=dirPath,absolutePath=.*\\logs$',
            '-skip:objectName=filePath,absolutePath=.*\\logs\\.*',
            '-retryAttempts:3',
            '-retryInterval:5000'
          )
          if ($env:WD_ALLOW_UNTRUSTED -eq 'true') { $msArgs += '-allowUntrusted' }
          & $env:MSDEPLOY @msArgs
          if ($LASTEXITCODE -ne 0) { throw "msdeploy failed with exit code $LASTEXITCODE" }

      - name: Diagnose web.config variants (diagnose only)
        if: ${{ inputs.diagnose }}
        env:
          WD_SERVER: ${{ secrets.MONSTERASP_WEBDEPLOY_SERVER }}
          WD_SITE: ${{ secrets.MONSTERASP_WEBDEPLOY_SITE }}
          WD_USER: ${{ secrets.MONSTERASP_WEBDEPLOY_USER }}
          WD_PASSWORD: ${{ secrets.MONSTERASP_WEBDEPLOY_PASSWORD }}
          WD_ALLOW_UNTRUSTED: ${{ vars.MONSTERASP_WEBDEPLOY_ALLOW_UNTRUSTED || 'false' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://crmtest.runasp.net' }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "::add-mask::$env:WD_PASSWORD"
          $base = $env:SITE_URL.TrimEnd('/')
          $server = ($env:WD_SERVER -replace '^https?://','' -replace '/.*$','')
          if ($server -notmatch ':\d+$') { $server = "${server}:8172" }
          $work = Join-Path $env:RUNNER_TEMP 'diag'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $srcCfg = (Resolve-Path (Join-Path package 'web.config')).Path   # already contains the environment variables; never printed

          # MonsterASP only allows the contentPath provider (filePath -> ERROR_USER_NOT_AUTHORIZED_FOR_DEPLOYMENTPROVIDER).
          # So: stage the file(s) alone in a folder and sync that folder with DoNotDeleteRule, so nothing else on the site is deleted.
          # No AppOffline rule: a web.config change recycles the app anyway, and AppOffline would write/remove app_offline.htm.
          function Push-Files([string[]]$locals, [switch]$WhatIf) {
            $stage = Join-Path $work 'stage'
            if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            foreach ($l in $locals) { Copy-Item $l (Join-Path $stage (Split-Path $l -Leaf)) }
            $dest = "contentPath=$($env:WD_SITE),computerName=https://$server/msdeploy.axd?site=$($env:WD_SITE),userName=$($env:WD_USER),password=$($env:WD_PASSWORD),authType=Basic"
            $a = @('-verb:sync', "-source:contentPath=$stage", "-dest:$dest", '-enableRule:DoNotDeleteRule', '-retryAttempts:2', '-retryInterval:3000')
            if ($WhatIf) { $a += '-whatif' }
            if ($env:WD_ALLOW_UNTRUSTED -eq 'true') { $a += '-allowUntrusted' }
            $out = (& $env:MSDEPLOY @a 2>&1 | Out-String) -replace [regex]::Escape($env:WD_PASSWORD), '***'
            $code = $LASTEXITCODE
            $summary = ($out -split "`r?`n" | Where-Object { $_ -match 'Total changes|Deleted|deleted|Updated|Added|ERROR' }) -join ' | '
            Write-Host "  msdeploy$(if ($WhatIf) { ' -whatif' }) exit=$code; $summary"
            if ($code -ne 0) { Write-Host $out; return $false }
            if ($WhatIf) {
              if ($out -match '(\d+)\s+objects? deleted' -and [int]$Matches[1] -gt 0) { Write-Host "  whatif would DELETE $($Matches[1]) objects"; return $false }
              if ($out -match '(\d+)\s+deleted' -and [int]$Matches[1] -gt 0) { Write-Host "  whatif would DELETE $($Matches[1]) objects"; return $false }
            }
            return $true
          }

          function Probe([string]$url) {
            try {
              $r = Invoke-WebRequest -Uri $url -SkipHttpErrorCheck -MaximumRedirection 0 -TimeoutSec 30
              $body = [string]$r.Content
              $srv = ($r.Headers['Server'] -join ',')
              Write-Host "  GET $url -> HTTP $([int]$r.StatusCode); body length=$($body.Length); Server=[$srv]"
              if ($body.Length -gt 0 -and $body.Length -le 200) { Write-Host "  body: $($body.Trim())" }
              return @{ Code = [int]$r.StatusCode; Body = $body.Trim() }
            } catch {
              Write-Host "  GET $url -> EXCEPTION $($_.Exception.Message)"
              return @{ Code = 0; Body = '' }
            }
          }

          function Remove-Nodes($doc, [string]$xpath) { foreach ($n in @($doc.SelectNodes($xpath))) { [void]$n.ParentNode.RemoveChild($n) } }
          function Unwrap-Location($doc) {
            $loc = $doc.SelectSingleNode('/configuration/location')
            if (-not $loc) { return }
            $root = $doc.DocumentElement
            foreach ($c in @($loc.ChildNodes)) { [void]$root.InsertBefore($c, $loc) }
            [void]$root.RemoveChild($loc)
          }
          # Cumulative steps, applied to a fresh copy of the real web.config for each variant.
          $steps = [ordered]@{
            noWebSocket  = { param($d) Remove-Nodes $d '//webSocket' }
            noHttpProto  = { param($d) Remove-Nodes $d '//httpProtocol' }
            noRemoveSrv  = { param($d) foreach ($n in @($d.SelectNodes('//requestFiltering'))) { [void]$n.Attributes.RemoveNamedItem('removeServerHeader') } }
            noHttpErrors = { param($d) Remove-Nodes $d '//httpErrors' }
            noLocation   = { param($d) Unwrap-Location $d }
            minimal      = { param($d) Remove-Nodes $d '//security'; Remove-Nodes $d '//httpProtocol'; Remove-Nodes $d '//httpErrors'; Remove-Nodes $d '//webSocket'; Unwrap-Location $d }
            outOfProcess = { param($d) Remove-Nodes $d '//security'; Remove-Nodes $d '//httpProtocol'; Remove-Nodes $d '//httpErrors'; Remove-Nodes $d '//webSocket'; Unwrap-Location $d; $d.SelectSingleNode('//aspNetCore').SetAttribute('hostingModel', 'outofprocess') }
          }
          $variants = @(
            @{ Name = 'V0 current (as deployed)';                     Apply = @() },
            @{ Name = 'V1 without webSocket';                         Apply = @('noWebSocket') },
            @{ Name = 'V2 + without httpProtocol';                    Apply = @('noWebSocket','noHttpProto') },
            @{ Name = 'V3 + without removeServerHeader';              Apply = @('noWebSocket','noHttpProto','noRemoveSrv') },
            @{ Name = 'V4 + without httpErrors';                      Apply = @('noWebSocket','noHttpProto','noRemoveSrv','noHttpErrors') },
            @{ Name = 'V5 + without location wrapper';                Apply = @('noWebSocket','noHttpProto','noRemoveSrv','noHttpErrors','noLocation') },
            @{ Name = 'V6 minimal (handlers+aspNetCore+envvars)';     Apply = @('minimal') },
            @{ Name = 'V8 minimal + hostingModel=outofprocess';       Apply = @('outOfProcess') }
          )

          function Write-Variant($v) {
            $doc = New-Object System.Xml.XmlDocument
            $doc.PreserveWhitespace = $false
            $doc.Load($srcCfg)
            foreach ($s in $v.Apply) { & $steps[$s] $doc }
            $f = Join-Path $work 'web.config'
            $ws = New-Object System.Xml.XmlWriterSettings
            $ws.Indent = $true
            $ws.Encoding = New-Object System.Text.UTF8Encoding($false)
            $w = [System.Xml.XmlWriter]::Create($f, $ws)
            try { $doc.Save($w) } finally { $w.Dispose() }
            return $f
          }

          # Safety check: -whatif of the exact command; abort if it would delete anything on the site.
          Write-Host '=== whatif precheck (DoNotDeleteRule must keep all other files) ==='
          $wf = Write-Variant $variants[0]
          if (-not (Push-Files @($wf) -WhatIf)) { throw 'Diagnose aborted: whatif failed or would delete files' }

          # V7: does IIS itself read web.config? Static file, no ANCM handler. 200 = IIS config is fine; 500 = IIS cannot parse the file.
          Write-Host '=== V7 static probe (no aspNetCore handler) ==='
          $v7dir = Join-Path $work 'v7'; New-Item -ItemType Directory -Force -Path $v7dir | Out-Null
          Set-Content -Path (Join-Path $v7dir 'diag.txt') -Value 'diag-ok' -NoNewline
          Set-Content -Path (Join-Path $v7dir 'web.config') -Value '<?xml version="1.0" encoding="utf-8"?><configuration><system.webServer><staticContent /></system.webServer></configuration>'
          if (Push-Files @((Join-Path $v7dir 'diag.txt'), (Join-Path $v7dir 'web.config'))) {
            Start-Sleep -Seconds 5
            $r7 = Probe "$base/diag.txt"
            Write-Host ("V7 result: " + $(if ($r7.Code -eq 200) { 'IIS serves static files with a trivial web.config (host and site OK; problem is in our web.config or in ANCM)' } else { 'IIS fails even with a trivial web.config (host/site-level problem, not our web.config elements)' }))
          }

          $winner = $null
          foreach ($v in $variants) {
            Write-Host "=== $($v.Name) ==="
            $f = Write-Variant $v
            if (-not (Push-Files @($f))) { continue }
            for ($i = 1; $i -le 3; $i++) {
              Start-Sleep -Seconds $(if ($i -eq 1) { 8 } else { 6 })
              $r = Probe "$base/healthz"
              if ($r.Code -eq 200 -and $r.Body -eq 'ok') { $winner = $v.Name; break }
              if ($r.Code -ne 500 -and $r.Code -ne 503) { break }
            }
            if ($winner) { break }
          }
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          if ($winner) {
            Write-Host "RESULT: first variant returning 200 = [$winner]. The site is left on this variant."
          } else {
            Write-Host 'RESULT: no variant returned 200. Site left on the last variant tried. See V7 result: if V7 was 200, ANCM/runtime problem (check hosting model, handler, bitness); if V7 failed, host-level problem.'
            throw 'Diagnose: no web.config variant produced a healthy /healthz'
          }

      - name: Smoke test
        if: ${{ !inputs.diagnose }}
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://crmtest.runasp.net' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = $env:SITE_URL.TrimEnd('/')
          Write-Host "pwsh $($PSVersionTable.PSVersion)"
          # Returns @{ Code; Body } and prints the real outcome: status, Server/X-Powered-By/Location, first 300 chars of body (tags stripped).
          function Probe([string]$url) {
            try {
              $r = Invoke-WebRequest -Uri $url -SkipHttpErrorCheck -MaximumRedirection 0 -TimeoutSec 30
              $body = [string]$r.Content
              $plain = ($body -replace '(?s)<(script|style)[^>]*>.*?</\1>', ' ' -replace '<[^>]+>', ' ' -replace '\s+', ' ').Trim()
              if ($plain.Length -gt 300) { $plain = $plain.Substring(0, 300) }
              $srv = ($r.Headers['Server'] -join ','); $xp = ($r.Headers['X-Powered-By'] -join ','); $loc = ($r.Headers['Location'] -join ',')
              Write-Host "  GET $url -> HTTP $([int]$r.StatusCode); Server=[$srv] X-Powered-By=[$xp] Location=[$loc]"
              Write-Host "  body: $plain"
              return @{ Code = [int]$r.StatusCode; Body = $body.Trim() }
            } catch {
              $e = $_.Exception
              Write-Host "  GET $url -> EXCEPTION $($e.GetType().FullName): $($e.Message)"
              if ($e.InnerException) { Write-Host "  inner: $($e.InnerException.GetType().FullName): $($e.InnerException.Message)" }
              return @{ Code = 0; Body = '' }
            }
          }
          # The app pool needs time to start after app_offline.htm is removed: retry /healthz for up to ~2 minutes.
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
            Write-Host "healthz attempt ${i}:"
            $res = Probe "$base/healthz"
            if ($res.Code -eq 200 -and $res.Body -eq 'ok') { $ok = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $ok) {
            Write-Host 'Hints: HTTP 500.30 = app failed at startup (bad/missing configuration: rerun with debug_stdout and read logs\stdout on the host); 500.31/500.32 = .NET 10 runtime/hosting bundle missing or bitness mismatch (try self_contained); 404 = files not at the site root.'
            throw 'Smoke test failed: /healthz did not return 200 "ok" within 2 minutes'
          }
          $res = Probe "$base/readyz"
          if ($res.Code -ne 200) { throw "Smoke test failed: /readyz returned HTTP $($res.Code) (database unreachable, not migrated, or time zone check failed)" }
          $res = Probe "$base/signin"
          if ($res.Code -ne 200) { throw "Smoke test failed: /signin returned HTTP $($res.Code)" }
          Write-Host 'Smoke test passed'
