name: .NET CI

# Build + test of the .NET 10 rewrite (docs/architecture/dotnet.md 14.2-14.3).
# Linux job: real SQL Server service container, migrations, RLS script, full test suite.
# Windows job: tests without SQL (SQL/HTTP tests skip when CRM_TEST_SQL_SA is unset) to catch globalization/time zone/path differences.
# Node CI (ci.yml) keeps running until cutover.
on:
  push:
    paths:
      - 'dotnet/**'
      - 'db/**'
      - '.github/workflows/dotnet-ci.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - 'db/**'
      - '.github/workflows/dotnet-ci.yml'

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: dotnet/Crm.slnx
  WEB_PROJECT: dotnet/src/Crm.Web

jobs:
  prep:
    # Per-run throwaway SA password for the service container, and a guard so a db/** change before dotnet/ exists does not fail.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_solution: ${{ steps.detect.outputs.has_solution }}
      sa_password: ${{ steps.pw.outputs.sa_password }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f "$SOLUTION" ]; then echo "has_solution=true" >> "$GITHUB_OUTPUT"; else echo "has_solution=false" >> "$GITHUB_OUTPUT"; echo "No $SOLUTION yet: .NET jobs skipped"; fi
      - id: pw
        # Alphanumeric only (no ';' or '=' that would break a connection string); satisfies the SQL Server complexity rules.
        run: echo "sa_password=Aa1-$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"

  linux:
    needs: prep
    if: needs.prep.outputs.has_solution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ needs.prep.outputs.sa_password }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      SA_CONNECTION: Server=localhost,1433;User ID=sa;Password=${{ needs.prep.outputs.sa_password }};Encrypt=True;TrustServerCertificate=True;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          if find dotnet -name packages.lock.json -not -path '*/node_modules/*' | grep -q .; then
            dotnet restore "$SOLUTION" --locked-mode
          else
            echo "No packages.lock.json yet: plain restore"
            dotnet restore "$SOLUTION"
          fi

      - name: Format check
        if: ${{ hashFiles('dotnet/.editorconfig') != '' }}
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      - name: Build (warnings are errors via Directory.Build.props)
        run: dotnet build "$SOLUTION" -c Release --no-restore

      - name: Vulnerable packages (fail on High/Critical)
        run: |
          dotnet list "$SOLUTION" package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -Eiq '\b(High|Critical)\b' vuln.txt; then echo "::error::High or Critical vulnerable package found"; exit 1; fi

      - name: Test with SQL service (SQL and HTTP tests must not skip)
        env:
          CRM_TEST_SQL_SA: ${{ env.SA_CONNECTION }}
          CRM_REQUIRE_SQL: 'true'
        run: dotnet test "$SOLUTION" -c Release --no-build

      - name: Create CI database
        env:
          DB_AUTH_MODE: sql-password
          DB_CONNECTION_STRING: ${{ env.SA_CONNECTION }}Database=master;
        run: |
          printf '%s\n' "IF DB_ID(N'crm_ci') IS NULL CREATE DATABASE crm_ci;" > "$RUNNER_TEMP/create-db.sql"
          dotnet run --project "$WEB_PROJECT" -c Release --no-build -- run-sql "$RUNNER_TEMP/create-db.sql"

      - name: Apply migrations twice (second run must be a no-op)
        env:
          DB_AUTH_MODE: sql-password
          DB_CONNECTION_STRING: ${{ env.SA_CONNECTION }}Database=crm_ci;
        run: |
          dotnet run --project "$WEB_PROJECT" -c Release --no-build -- migrate
          dotnet run --project "$WEB_PROJECT" -c Release --no-build -- migrate

      - name: RLS integration script (any FAIL fails the build)
        env:
          DB_AUTH_MODE: sql-password
          DB_CONNECTION_STRING: ${{ env.SA_CONNECTION }}Database=crm_ci;
        run: dotnet run --project "$WEB_PROJECT" -c Release --no-build -- run-sql db/tests/rls-integration.sql

      - name: Demo data (seed-demo twice, SQL checks, RLS integration with demo rows present, reset, refusals)
        shell: bash
        env:
          DB_AUTH_MODE: sql-password
          DB_CONNECTION_STRING: ${{ env.SA_CONNECTION }}Database=crm_ci;
          ALLOW_DEMO_SEED: 'true'
          AUTH_MODE: test-access-code
        run: |
          set -euo pipefail
          run() { dotnet run --project "$WEB_PROJECT" -c Release --no-build -- "$@"; }
          run seed-test
          run seed-demo --yes-demo
          run seed-demo --yes-demo | tee second-run.txt
          grep -q "already present" second-run.txt   # idempotent: the second run changes nothing
          run run-sql db/tests/demo-seed-check.sql
          run run-sql db/tests/rls-integration.sql    # RLS still holds with demo rows in the tables
          run seed-demo --yes-demo --reset-demo --demo-settings
          run run-sql db/tests/demo-seed-check.sql
          run run-sql db/tests/rls-integration.sql
          # Refusals: each of these must fail and write nothing.
          if run seed-demo; then echo "::error::seed-demo ran without --yes-demo"; exit 1; fi
          if LIVE=true run seed-demo --yes-demo; then echo "::error::seed-demo ran with LIVE=true"; exit 1; fi
          if WEBSITE_INSTANCE_ID=x run seed-demo --yes-demo; then echo "::error::seed-demo ran on Azure"; exit 1; fi
          if ALLOW_DEMO_SEED= run seed-demo --yes-demo; then echo "::error::seed-demo ran without ALLOW_DEMO_SEED"; exit 1; fi
          if AUTH_MODE=entra run seed-demo --yes-demo; then echo "::error::seed-demo ran with AUTH_MODE=entra"; exit 1; fi
          if DB_AUTH_MODE=managed-identity run seed-demo --yes-demo; then echo "::error::seed-demo ran with managed identity"; exit 1; fi

      - name: Publish (framework-dependent; contains no secrets)
        run: dotnet publish "$WEB_PROJECT" -c Release --no-build -o out/web

      - uses: actions/upload-artifact@v4
        with:
          name: crm-web-publish
          path: out/web/
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prep
    if: needs.prep.outputs.has_solution == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore $env:SOLUTION
      - name: Build
        run: dotnet build $env:SOLUTION -c Release --no-restore
      - name: Test without SQL (SQL and HTTP tests skip, unit tests must pass)
        run: dotnet test $env:SOLUTION -c Release --no-build
