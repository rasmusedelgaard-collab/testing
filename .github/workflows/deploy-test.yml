name: Node DB tasks on test (manual)

# The Node app is NO LONGER deployed to MonsterASP (the site is switching to .NET 10, see ADR-0007 and
# deploy-dotnet-test.yml). The Node build/deploy jobs were removed; only the manual DB jobs remain:
#   migrate  = db:migrate + db:seed:test via the Node runner
#   rls_test = db/tests/rls-integration.sql via the Node runner
# Secrets and variables live in the GitHub Environment `test`.
on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run db:migrate and db:seed:test (needs the DB to accept GitHub runner IPs)
        type: boolean
        default: false
      run_rls_test:
        description: Run db/tests/rls-integration.sql against the test database (rolls back; fails on any FAIL row)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # GitHub runner IPs are dynamic: if the host's DB firewall rejects them this fails; run from your own PC instead.
      # DB_* env is set per step so the password is only visible to the two db: commands.
      - name: Migrate
        run: npm run db:migrate
        env:
          DB_AUTH_MODE: sql-password
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          DB_TRUST_SERVER_CERT: ${{ vars.DB_TRUST_SERVER_CERT || 'false' }}
      - name: Seed test users
        run: npm run db:seed:test
        env:
          DB_AUTH_MODE: sql-password
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          DB_TRUST_SERVER_CERT: ${{ vars.DB_TRUST_SERVER_CERT || 'false' }}
          TEST_ADMIN_NAME: ${{ vars.TEST_ADMIN_NAME }}
          TEST_ADMIN_EMAIL: ${{ vars.TEST_ADMIN_EMAIL }}

  rls_test:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.run_rls_test && needs.verify.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    needs: [verify, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run RLS integration test
        run: npm run db:run-sql -- db/tests/rls-integration.sql
        env:
          DB_AUTH_MODE: sql-password
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          DB_TRUST_SERVER_CERT: ${{ vars.DB_TRUST_SERVER_CERT || 'false' }}
