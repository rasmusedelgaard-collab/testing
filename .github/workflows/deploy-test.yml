name: Deploy to test (MonsterASP)

# Builds the deploy package and force-pushes it as ONE fresh orphan commit to branch `deploy`.
# MonsterASP git-deploys from that branch. No secrets are used or needed (only the built-in GITHUB_TOKEN);
# runtime secrets live in crm.env on the host (docs/deploy/monsterasp.md). Add `main` below once it is the trunk.
on:
  push:
    branches: [claude/tender-darwin-4quuzo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build package
        run: npm run package
      - name: Force-push package to deploy branch as a single orphan commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SRC_SHA: ${{ github.sha }}
          SRC_REF: ${{ github.ref_name }}
        working-directory: package
        run: |
          set -euo pipefail
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "deploy: ${SRC_SHA:0:7} from ${SRC_REF}" -m "Built from ${SRC_SHA}. Generated; do not edit."
          git remote add origin "https://github.com/${REPO}.git"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH}" push --force origin deploy
